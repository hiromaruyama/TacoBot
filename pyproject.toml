# Tooling config only. TacoBot's runtime deps come from upstream/ (`cd upstream && uv sync`).
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["upstream"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731"]
